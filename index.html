const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
const O='#1b1826',CX=[70,160,250];
const sec=s=>{const [h,m,x]=s.split(':').map(Number);return h*3600+m*60+(x||0);};
const fmt=new Intl.DateTimeFormat('en-GB',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const q=new URLSearchParams(location.search),t0=performance.now();
function now(){
  if(q.get('h'))return sec(q.get('h'))+(performance.now()-t0)/1000*(+q.get('speed')||1);
  const p=Object.fromEntries(fmt.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return (+p.hour%24)*3600+(+p.minute)*60+(+p.second);
}
const pad=n=>String(Math.floor(n)).padStart(2,'0');
const R=(x,y,w,h,f)=>{ctx.fillStyle=O;ctx.fillRect(x,y,w,h);ctx.fillStyle=f;ctx.fillRect(x+1,y+1,w-2,h-2);};
const F=(x,y,w,h,f)=>{ctx.fillStyle=f;ctx.fillRect(x,y,w,h);};
CHARS.forEach(c=>{const dx=CX[c.desk];c.pts=[[24,56],[24,128],[dx,128],[dx,94]];
  c.L=0;for(let i=1;i<4;i++)c.L+=Math.abs(c.pts[i][0]-c.pts[i-1][0])+Math.abs(c.pts[i][1]-c.pts[i-1][1]);c.dur=c.L/SPEED;});
function along(p,d){for(let i=1;i<p.length;i++){const l=Math.abs(p[i][0]-p[i-1][0])+Math.abs(p[i][1]-p[i-1][1]);
  if(d<=l||i==p.length-1){const f=Math.max(0,Math.min(1,d/l));return[p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f];}d-=l;}}
function state(c,t){
  const s=sec(START)+c.off,e=sec(END)+c.off;
  if(t<s||t>e+c.dur)return null;
  const mv=(d,sg)=>{const a=along(c.pts,d),b=along(c.pts,d+sg*3);return{pos:a,sit:false,al:Math.min(1,d/8),vx:b[0]-a[0],vy:b[1]-a[1]};};
  if(t<s+c.dur)return mv((t-s)*SPEED,1);
  if(t<=e)return{pos:c.pts[3],sit:true,al:1};
  return mv(c.L-(t-e)*SPEED,-1);
}
const dirName=(vx,vy)=>Math.abs(vx)>Math.abs(vy)?(vx>0?'east':'west'):(vy>0?'south':'north');
function person(c,st,t){
  const S=SP[c.set];ctx.globalAlpha=st.al;
  if(st.sit){ctx.drawImage(S.i.north,0,0,32,24,CX[c.desk]-16,62,32,24);}
  else{const bob=Math.floor(t*6)%2;ctx.drawImage(S.w[dirName(st.vx,st.vy)],Math.round(st.pos[0]-16),Math.round(st.pos[1]-32-bob));}
  ctx.globalAlpha=1;
}
function desk(i,on){
  const x=CX[i]-28;
  R(x,70,56,16,'#b98b5e');F(x+1,71,54,1,'#d4a874');
  R(x,86,56,8,'#8a6340');
  R(x+18,52,20,17,'#2c3042');F(x+20,54,16,12,on?'#7fd0ff':'#0f1220');
  if(on){F(x+22,57,9,1,'#e9f8ff');F(x+22,60,12,1,'#e9f8ff');F(x+22,63,6,1,'#e9f8ff');}
  F(x+26,69,4,2,'#2c3042');
  R(x+16,77,24,5,'#cfd4de');R(x+46,74,6,6,'#d8584e');
}
function chair(i){const x=CX[i]-10;R(x,85,20,9,'#4b516b');F(x+2,87,16,1,'#656c8a');}
function room(lit){
  for(let ty=3;ty<12;ty++)for(let tx=0;tx<20;tx++)F(tx*16,ty*16,16,16,(tx+ty)%2?'#56627f':'#505b78');
  F(0,0,320,48,'#6b7a9e');F(0,0,320,3,'#8593b5');F(0,43,320,5,'#38425e');F(0,48,320,1,O);F(0,49,320,3,'#444e69');
  R(12,16,24,32,'#7a5242');F(16,20,16,10,'#8d6350');F(16,33,16,10,'#8d6350');F(30,34,2,2,'#e6c36a');
  [76,224].forEach(x=>{R(x,8,36,26,lit?'#9fd3f5':'#1c2744');F(x+17,9,2,24,O);F(x+1,20,34,2,O);});
  R(150,10,20,26,'#e8dcae');F(154,15,12,8,'#5e8ccf');F(154,26,12,2,'#b4a779');F(154,30,8,2,'#b4a779');
  R(302,148,10,18,'#4e9a5b');R(296,154,8,12,'#3f8a52');R(310,152,8,14,'#3f8a52');R(300,164,14,14,'#9b5f45');
}
let dark=0;
function draw(){
  const t=now(),sts=CHARS.map(c=>state(c,t)),lit=sts.some(Boolean);
  dark+=((lit?0:.6)-dark)*.04;
  ctx.clearRect(0,0,320,192);room(lit);
  const items=[];
  [0,1,2].forEach(i=>{const k=CHARS.findIndex(c=>c.desk==i);
    items.push([92,()=>desk(i,k>=0&&!!sts[k]&&sts[k].sit)]);items.push([93,()=>chair(i)]);});
  CHARS.forEach((c,i)=>{const s=sts[i];if(s)items.push([s.sit?92.5:s.pos[1],()=>person(c,s,t)]);});
  items.sort((a,b)=>a[0]-b[0]).forEach(i=>i[1]());
  ctx.fillStyle='rgba(6,9,26,'+dark.toFixed(3)+')';ctx.fillRect(0,0,320,192);
  document.getElementById('clock').textContent=pad(t/3600)+':'+pad(t%3600/60)+':'+pad(t%60);
  const here=CHARS.filter((c,i)=>sts[i]&&sts[i].sit).map(c=>c.name);
  document.getElementById('st').textContent=lit?(here.length?'Trabalhando: '+here.join(', '):'Chegando ou saindo'):'Escritório fechado';
  requestAnimationFrame(draw);
}
draw();
